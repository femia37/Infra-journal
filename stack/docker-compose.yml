services:
  caddy:
    image: caddy:latest
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  n8n:
    image: n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - GENERIC_TIMEZONE=Africa/Lagos
      - TZ=Africa/Lagos
      - N8N_HOST=n8n.automatewithfemi.com
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.automatewithfemi.com/
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
    external: true
  caddy_data:
  caddy_config:

